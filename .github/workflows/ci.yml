name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # 手动触发：可选附带四个 durable-workflow E2E（goal/resume/crash×2，
  # 约 25 分钟）。按需在 Actions 页勾选 slow_suite，不进常规 PR CI。
  workflow_dispatch:
    inputs:
      slow_suite:
        description: "Also run the four durable-workflow E2E flows (goal/resume/crash/non-idempotent) — ~25 extra minutes"
        type: boolean
        default: true

# Minimal ship-loop CI (⑦): headless project import gate + GUT unit tests.
# Pinned to the same Godot version the addon targets (project.godot ->
# config/features "4.7"); bump GODOT_VERSION here when the project's required
# engine version changes. GUT (the test runner) is not vendored in this repo,
# so CI fetches it at the pinned tag.
#
# The GUT step runs the full unit suite (test/unit/ + subdirs). The previously
# tracked pre-existing failures (stale tool counts, missing Meta-group
# translations, runtime-probe poll resend, terrain peering API gap, hidden-dir
# owner scan, headless editor-interface guards) have been fixed, so the whole
# suite is green under the target engine. Headless-only cases use GUT
# pending_test() and source-introspection cases are risky/no-assert; neither
# counts as a failure, so CI stays a trustworthy gate.

env:
  GODOT_VERSION: "4.7"
  GUT_VERSION: "9.7.1"

jobs:
  gut-tests:
    # Windows 实证同套件 43 秒跑完；ubuntu 上 --import 平台性挂起（报错修复
    # 后暴露，watchdog 注释已留待根因）。深度与速度兼得：单测与集成都在
    # Windows runner 上跑，Linux 挂起问题单独跟踪。
    name: Headless import + GUT unit tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-win64-ci

      - name: Download Godot ${{ env.GODOT_VERSION }} (Windows)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "godot/Godot_v${GODOT_VERSION}-stable_win64.exe" ]; then
            mkdir -p godot
            curl -fL --retry 3 -o godot.zip               "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_win64.exe.zip"
            unzip -o godot.zip -d godot
            rm godot.zip
          fi
          "godot/Godot_v${GODOT_VERSION}-stable_win64.exe" --version

      - name: Fetch GUT ${{ env.GUT_VERSION }} test runner
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${GUT_VERSION}" https://github.com/bitwes/Gut.git /tmp/gut
          rm -rf addons/gut
          cp -r /tmp/gut/addons/gut addons/gut
          test -f addons/gut/gut_cmdln.gd

      - name: Headless import gate (project must import cleanly)
        shell: bash
        run: |
          set -euo pipefail
          # Import assets / build the resource cache, then fail the build if any
          # production script failed to parse or load. A clean import under the
          # target engine is the cheapest, most objective "is it buildable" gate.
          "godot/Godot_v${GODOT_VERSION}-stable_win64.exe" --headless --path . --import 2>&1 | tee import.log
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to (load|parse) script" import.log > import_errors.txt; then
            # 把匹配行同时打进 annotation，API/PR 界面直接可见，便于无日志权限排查。
            while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done < import_errors.txt | head -20
            echo "::error::Project failed to import cleanly (see annotations)."
            exit 1
          fi
          # The plugin lifecycle must not rewrite the versioned project file
          # (for example, removing the MCPRuntimeProbe autoload on exit).
          if ! git diff --exit-code -- project.godot; then
            echo "::error::godot --import modified project.godot. The plugin must preserve project configuration on shutdown."
            git diff -- project.godot
            exit 1
          fi

      # 全量 GUT 在 Linux CI 存在平台性挂起（本地 43s / CI 45min 不完，
      # watchdog 注释已就位待定位）。行为深度由 Windows 集成 job（36 个真实
      # 编辑器测试）承担；导入门禁保证全部脚本可解析加载。
      - name: GUT unit tests (full suite, watchdogged)
        shell: bash
        run: |
          set -uo pipefail
          # -gdisable_colors 是本断言链的前提：GUT 默认彩色输出会把失败行
          # 包成 ESC[31m...[Failed]，'^\s*\[Failed\]' 永远匹配不上（曾因此
          # 整个作业对测试失败结构性假绿）。
          timeout 900 "godot/Godot_v${GODOT_VERSION}-stable_win64.exe" --headless --path .             -s addons/gut/gut_cmdln.gd             -gdir=res://test/unit/             -ginclude_subdirs             -gexit             -gdisable_colors 2>&1 | tee gut.log
          gut_exit=${PIPESTATUS[0]}
          if [ "$gut_exit" = "124" ]; then
            echo "::error::smoke watchdog fired - suite hung. Last log lines:"
            tail -15 gut.log | while IFS= read -r line; do echo "::error::${line:0:300}"; done
            exit 1
          fi
          # GUT 自身几乎总是 quit(0)：解析崩溃、零测试运行等任何非零退出
          # 都必须显式变红，不能只靠下面的 grep。
          if [ "$gut_exit" -ne 0 ]; then
            echo "::error::GUT exited with ${gut_exit} (parse/toolchain failure)"
            grep -nE "SCRIPT ERROR|Parse Error|Failed to (load|parse) script" gut.log | head -10
            exit 1
          fi
          if grep -qE '^\s*\[Failed\]' gut.log; then
            echo "::error::smoke suite reported failing assertions"
            grep -E '^\s*\[Failed\]' gut.log | head -5
            exit 1
          fi
          # 解析失败的测试文件会被 GUT 静默跳过（"Ignoring script ... does
          # not extend GutTest"）——test_server_resurrection.gd 曾这样从
          # 套件里消失而 CI 全绿。（注意：正常绿跑也包含约 16 个测试故意
          # 制造的 SCRIPT ERROR，因此不能对 gut.log 全量 grep 脚本错误；
          # 生产脚本解析问题由导入门禁负责。）
          if grep -q "Ignoring script" gut.log; then
            echo "::error::GUT silently ignored at least one test script (parse failure)"
            grep "Ignoring script" gut.log | head -5
            exit 1
          fi
          # 最小规模下限：防止"零测试运行也算过"。当前基线约 100 个脚本、
          # 1828 个测试；留出下浮余量，只在大量脚本消失时报警。
          scripts_run=$(grep -oE 'Scripts[^0-9]*[0-9]+' gut.log | grep -oE '[0-9]+' | head -1 || echo 0)
          tests_run=$(grep -oE 'Tests[^0-9]*[0-9]+' gut.log | grep -oE '[0-9]+' | head -1 || echo 0)
          if [ "${scripts_run:-0}" -lt 95 ] || [ "${tests_run:-0}" -lt 1700 ]; then
            echo "::error::suite unexpectedly small: scripts=${scripts_run:-?} tests=${tests_run:-?} (expected >=95 scripts, >=1700 tests)"
            tail -20 gut.log
            exit 1
          fi

  integration-fast:
    name: Integration (fast set, Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: gut-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.6.3 (Windows build)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot
          curl -fL --retry 3 -o godot.zip             https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip
          unzip -o godot.zip -d godot
          rm godot.zip

      # 全新 checkout 没有 .godot/ 缓存：编辑器首启要全量导入约 235 个资源，
      # MCP 服务器就绪慢于测试的等待窗口（超时类失败），且 main_scene 的
      # uid:// 引用在冷缓存下解析为空（"no main scene configured"）。
      # 先跑一次 --import 建缓存，后续每个测试的编辑器启动都是热缓存。
      - name: Warm the import cache (cold checkout imports on first boot)
        shell: bash
        env:
          GODOT_EXE: godot/Godot_v4.6.3-stable_win64.exe
        run: |
          set -euo pipefail
          "$GODOT_EXE" --headless --path . --import 2>&1 | tee warm_import.log
          # 4.6.3 专属的解析错误只在这条腿上可见（单测作业跑 4.7）：
          # --import 对脚本解析失败仍退出 0，必须靠日志判定。
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to (load|parse) script" warm_import.log > warm_errors.txt; then
            while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done < warm_errors.txt | head -20
            echo "::error::4.6.3 warm import reported script errors (see annotations)."
            exit 1
          fi

      - name: Run fast integration suite via the runner
        shell: bash
        env:
          GODOT_EXE: godot/Godot_v4.6.3-stable_win64.exe
          # 临时 runner 上只有本套件的 Godot 进程：允许 runner 按映像名
          # 整体清扫孤儿进程（本地默认走精确匹配仓库路径的清扫）。
          MCP_RUNNER_KILL_ALL_GODOT: "1"
        run: python test/integration/run_integration.py --timeout 420

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-logs
          path: test/integration/

  # 四个 durable-workflow E2E（完整 goal / 崩溃恢复 / 断点续跑 / 非幂等
  # 崩溃语义）是本插件的核心卖点，但单个就要数分钟——只在工作流被手动
  # 触发且勾选 slow_suite 时运行，不占常规 PR CI。合并前请手动跑一次。
  integration-slow:
    name: Durable workflow E2E (manual, slow set)
    runs-on: windows-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && inputs.slow_suite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.6.3 (Windows build)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot
          curl -fL --retry 3 -o godot.zip             https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip
          unzip -o godot.zip -d godot
          rm godot.zip

      - name: Warm the import cache (cold checkout imports on first boot)
        shell: bash
        env:
          GODOT_EXE: godot/Godot_v4.6.3-stable_win64.exe
        run: |
          set -euo pipefail
          "$GODOT_EXE" --headless --path . --import

      - name: Run durable-workflow E2E suite
        shell: bash
        env:
          GODOT_EXE: godot/Godot_v4.6.3-stable_win64.exe
          MCP_RUNNER_KILL_ALL_GODOT: "1"
        run: python test/integration/run_integration.py --filter goal --slow --timeout 900

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-slow-failure-logs
          path: test/integration/
