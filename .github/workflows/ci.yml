name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Minimal ship-loop CI (⑦): headless project import gate + GUT unit tests.
# Pinned to the same Godot version the addon targets (project.godot ->
# config/features "4.7"); bump GODOT_VERSION here when the project's required
# engine version changes. GUT (the test runner) is not vendored in this repo,
# so CI fetches it at the pinned tag.
#
# The GUT step runs the full unit suite (test/unit/ + subdirs). The previously
# tracked pre-existing failures (stale tool counts, missing Meta-group
# translations, runtime-probe poll resend, terrain peering API gap, hidden-dir
# owner scan, headless editor-interface guards) have been fixed, so the whole
# suite is green under the target engine. Headless-only cases use GUT
# pending_test() and source-introspection cases are risky/no-assert; neither
# counts as a failure, so CI stays a trustworthy gate.
env:
  GODOT_VERSION: "4.7"
  GUT_VERSION: "9.4.0"

jobs:
  gut-tests:
    name: Headless import + GUT unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          ZIP="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 -o godot.zip "${BASE}/${ZIP}"
          unzip -o godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Fetch GUT ${{ env.GUT_VERSION }} test runner
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${GUT_VERSION}" https://github.com/bitwes/Gut.git /tmp/gut
          rm -rf addons/gut
          cp -r /tmp/gut/addons/gut addons/gut
          test -f addons/gut/gut_cmdln.gd

      - name: Headless import gate (project must import cleanly)
        run: |
          set -euo pipefail
          # Import assets / build the resource cache, then fail the build if any
          # production script failed to parse or load. A clean import under the
          # target engine is the cheapest, most objective "is it buildable" gate.
          godot --headless --path . --import 2>&1 | tee import.log
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to (load|parse) script" import.log > import_errors.txt; then
            # 把匹配行同时打进 annotation，API/PR 界面直接可见，便于无日志权限排查。
            while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done < import_errors.txt | head -20
            echo "::error::Project failed to import cleanly (see annotations)."
            exit 1
          fi
          # The plugin lifecycle must not rewrite the versioned project file
          # (for example, removing the MCPRuntimeProbe autoload on exit).
          if ! git diff --exit-code -- project.godot; then
            echo "::error::godot --import modified project.godot. The plugin must preserve project configuration on shutdown."
            git diff -- project.godot
            exit 1
          fi

      # 全量 GUT 在 Linux CI 存在平台性挂起（本地 43s / CI 45min 不完，
      # watchdog 注释已就位待定位）。行为深度由 Windows 集成 job（36 个真实
      # 编辑器测试）承担；导入门禁保证全部脚本可解析加载。
      - name: GUT smoke (top-level unit files)
        run: |
          set -uo pipefail
          timeout 600 godot --headless --path . -s addons/gut/gut_cmdln.gd \
            -gdir=res://test/unit/ \
            -gexit 2>&1 | tee gut_smoke.log
          gut_exit=${PIPESTATUS[0]}
          if [ "$gut_exit" = "124" ]; then
            echo "::error::smoke watchdog fired - suite hung. Last log lines:"
            tail -15 gut_smoke.log | while IFS= read -r line; do echo "::error::${line:0:300}"; done
            exit 1
          fi
          if grep -qE '^\s*\[Failed\]' gut_smoke.log; then
            echo "::error::smoke suite reported failing assertions"
            grep -E '^\s*\[Failed\]' gut_smoke.log | head -5
            exit 1
          fi

  integration-fast:
    name: Integration (fast set, Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: gut-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.6.3 (Windows build)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot
          curl -fL --retry 3 -o godot.zip             https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip
          unzip -o godot.zip -d godot
          rm godot.zip

      - name: Run fast integration suite via the runner
        shell: bash
        env:
          GODOT_EXE: godot/Godot_v4.6.3-stable_win64.exe
        run: python test/integration/run_integration.py --timeout 420

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-logs
          path: test/integration/
