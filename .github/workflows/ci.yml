name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: "4.7"
  GUT_VERSION: "9.4.0"

jobs:
  gut-tests:
    name: Headless import + GUT unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          ZIP="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 -o godot.zip "${BASE}/${ZIP}"
          unzip -o godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Fetch GUT ${{ env.GUT_VERSION }} test runner
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${GUT_VERSION}" https://github.com/bitwes/Gut.git /tmp/gut
          rm -rf addons/gut
          cp -r /tmp/gut/addons/gut addons/gut
          test -f addons/gut/gut_cmdln.gd

      - name: Headless import gate
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to (load|parse) script" import.log; then
            echo "::error::Project failed to import cleanly."
            exit 1
          fi
          if ! git diff --exit-code -- project.godot; then
            echo "::error::godot --import modified project.godot."
            git diff -- project.godot
            exit 1
          fi

      - name: Run GUT unit tests
        run: |
          set -euo pipefail
          godot --headless --path . -s addons/gut/gut_cmdln.gd \
            -gdir=res://test/unit/ \
            -ginclude_subdirs \
            -gexit

  p4-2d-gate-lab:
    name: P4 2D full game E2E gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          ZIP="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 -o godot.zip "${BASE}/${ZIP}"
          unzip -o godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Install virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      - name: Run P4 2D Gate Lab
        env:
          GODOT_BIN: /usr/local/bin/godot
          P4_2D_GATE_REQUIRE_EXPORT: "0"
        run: |
          set -euo pipefail
          xvfb-run -a python3 test/integration/run_p4_2d_full_gate_flow.py 2>&1 | tee p4-2d-gate.log
          grep '^P4_2D_GATE_REPORT=' p4-2d-gate.log

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-2d-gate-log
          path: p4-2d-gate.log
          if-no-files-found: warn
